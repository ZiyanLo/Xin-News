name: Deploy Xin News to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check static files
        run: |
          node --check dist/app.js
          node -e "JSON.parse(require('fs').readFileSync('dist/news.json', 'utf8'))"
          test -f dist/index.html
          node --test scripts/news-policy.test.cjs
          node scripts/check-news.cjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
